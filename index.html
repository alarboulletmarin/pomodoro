<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Pomodoro</title>
    <meta
      name="description"
      content="Un minuteur de travail qui te laisse partir : une durée, une session, une pause. Pas de notification, pas de compte, pas de série à tenir."
    />

    <!-- What a pasted link unfurls into: the app has to say what it is before it is opened.
         SITE_URL is substituted at build time; empty leaves the paths relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pomodoro" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Pomodoro — un minuteur de travail qui te laisse partir" />
    <meta
      property="og:description"
      content="Un minuteur de travail qui te laisse partir : une durée, une session, une pause. Pas de notification, pas de compte, pas de série à tenir."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Un minuteur affichant 25:00, sous le titre « un minuteur de travail qui te laisse partir »."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pomodoro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Le « v » des favicons est rempli au build par une empreinte du fichier, voir le
         plugin `asset-stamp` : un onglet garderait sinon le dessin d'avant jusqu'à
         expiration du cache. -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=%V:icons/icon.svg%" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/icon-32.png?v=%V:icons/icon-32.png%"
    />

    <!-- Nu, et à la racine. iOS ne suit pas toujours la balise : quand il ne la lit
         pas, il demande `/apple-touch-icon.png` de lui-même, et rien d'autre. C'est
         aussi la seule adresse qu'il n'ait jamais mise en cache pour ce site, donc
         un téléphone qui a déjà l'application reprend le dessin sans rien vider.
         Pas de `?v=` ici : ce que va chercher le système, on le lui donne nu. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-variable.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/clash-display-600.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
