<!doctype html>
<!-- Source of public/og.png, the card a pasted link unfurls into.
     Render: 1200×630, deviceScaleFactor 1. See README, "The link". -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Clash Display';
        src: url('../public/fonts/clash-display-600.woff2') format('woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: 'Clash Display';
        src: url('../public/fonts/clash-display-500.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Inter Variable';
        src: url('../public/fonts/inter-variable.woff2') format('woff2');
        font-weight: 400 600;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        padding: 56px;
        background: #fbf6ee;
        color: #221e1a;
        font-family: 'Clash Display', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 52px 60px;
        border-radius: 30px;
        background: #ffffff;
        box-shadow:
          0 1px 0 rgba(34, 30, 26, 0.06),
          0 30px 60px -40px rgba(34, 30, 26, 0.8);
      }

      .name {
        font-family: 'Clash Display', sans-serif;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        color: #6b625a;
      }

      /* The sentence is the message and has to survive being shown 350px wide in a
         chat: it is the largest thing on the card, set in the text face, ranged left.
         The clock is the illustration, not the headline. */
      .lead {
        font-family: 'Inter Variable', sans-serif;
        max-width: 900px;
        font-size: 76px;
        font-weight: 600;
        line-height: 1.14;
        letter-spacing: -1.6px;
      }

      .device {
        display: flex;
        align-items: center;
        gap: 32px;
      }

      .clock {
        flex: none;
        font-size: 92px;
        font-weight: 600;
        letter-spacing: -5px;
        line-height: 0.9;
      }

      .bar {
        flex: 1;
        height: 14px;
        border-radius: 999px;
        background: rgba(34, 30, 26, 0.09);
        overflow: hidden;
      }

      .fill {
        width: 38%;
        height: 100%;
        border-radius: 999px;
        background: #d63e45;
      }

      /* Same split as the app: Clash for the clock and the line, Inter for the rest. */
      .foot {
        display: flex;
        gap: 18px;
        font-family: 'Inter Variable', sans-serif;
        font-size: 27px;
        font-weight: 400;
        color: #6b625a;
      }

      .dot {
        color: rgba(34, 30, 26, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="name">pomodoro</p>

      <p class="lead">Un minuteur de travail<br />qui te laisse partir.</p>

      <div class="device">
        <p class="clock">25:00</p>
        <div class="bar"><div class="fill"></div></div>
      </div>

      <div class="foot">
        <span>pas de notification</span><span class="dot">·</span>
        <span>pas de compte</span><span class="dot">·</span>
        <span>rien ne sort de ton appareil</span>
      </div>
    </div>
  </body>
</html>
